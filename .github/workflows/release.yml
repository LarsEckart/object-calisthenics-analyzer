name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # Preflight: build and check signatures without publishing.

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name || 'v0.0.0-signing-check' }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$version" == *-SNAPSHOT ]]; then
            echo "Release tags must name a non-SNAPSHOT version, for example v0.1.0." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew check -PreleaseVersion="${{ steps.version.outputs.value }}"
      - name: Sign and check Maven artifacts
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :analyzer:signMavenPublication -PreleaseVersion="${{ steps.version.outputs.value }}"
          fingerprint=45353912409CF4BE37320C1FE012009D3EE97E82
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --max-time 20 \
              "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fingerprint" \
              -o "$RUNNER_TEMP/release-public.asc"; then break; fi
            echo "Public key not available yet (attempt $attempt/10)"
            sleep 5
          done
          test "$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/release-public.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = "$fingerprint"
          gpg --batch --import "$RUNNER_TEMP/release-public.asc"
          count=0
          while IFS= read -r -d '' signature; do
            gpg --batch --verify "$signature" "${signature%.asc}"
            count=$((count + 1))
          done < <(find analyzer/build -name '*.asc' -type f -print0)
          test "$count" -ge 5

      - name: Validate Plugin Portal publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins --validate-only -PreleaseVersion="${{ steps.version.outputs.value }}"

  publish-analyzer:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish analyzer to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew :analyzer:publishAndReleaseToMavenCentral -PreleaseVersion="${{ needs.validate.outputs.release_version }}"

  await-analyzer:
    needs: [validate, publish-analyzer]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for analyzer on Maven Central
        env:
          VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          url="https://repo.maven.apache.org/maven2/com/larseckart/object-calisthenics-analyzer/$VERSION/object-calisthenics-analyzer-$VERSION.pom"
          for attempt in {1..60}; do
            if curl --fail --location --silent --show-error --head "$url"; then
              exit 0
            fi
            echo "Analyzer not available yet (attempt $attempt/60); waiting 10 seconds"
            sleep 10
          done
          echo "Analyzer did not reach Maven Central: $url" >&2
          exit 1

  publish-plugin:
    needs: [validate, await-analyzer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins -PreleaseVersion="${{ needs.validate.outputs.release_version }}"

  smoke:
    needs: [validate, publish-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test plugin from a fresh project
        env:
          VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          for attempt in {1..30}; do
            if ./scripts/smoke-released-plugin.sh "$VERSION"; then
              exit 0
            fi
            echo "Plugin not available yet (attempt $attempt/30); waiting 10 seconds"
            sleep 10
          done
          echo "Released plugin did not resolve from the default Plugin Portal setup." >&2
          exit 1
