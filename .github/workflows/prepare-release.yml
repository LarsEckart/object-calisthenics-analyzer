name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION. Expected format: X.Y.Z or X.Y.Z-prerelease" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "SNAPSHOT versions are not allowed for releases." >&2
            exit 1
          fi

      - name: Update README version strings
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i -E 's/id\("com\.larseckart\.object-calisthenics"\) version "[^"]*"/id("com.larseckart.object-calisthenics") version "'"$VERSION"'"/g' README.md
          sed -i -E 's/com\.larseckart:object-calisthenics-analyzer:[0-9A-Za-z.-]*/com.larseckart:object-calisthenics-analyzer:'"$VERSION"'/g' README.md

          if ! grep -q 'id("com.larseckart.object-calisthenics") version "'"$VERSION"'"' README.md; then
            echo "Plugin version string was not updated in README.md" >&2
            exit 1
          fi

          if ! grep -q 'com.larseckart:object-calisthenics-analyzer:'"$VERSION" README.md; then
            echo "Analyzer version string was not updated in README.md" >&2
            exit 1
          fi

      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md
          if git diff --cached --quiet; then
            echo "README.md is already at version $VERSION."
          else
            git commit -m "release: prepare v$VERSION"
          fi

          git pull --rebase origin main
          git push origin HEAD:main

          tag="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists on origin." >&2
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes
